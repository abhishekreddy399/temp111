apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: civic-sense
  labels:
    app: admin-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      containers:
      - name: admin-service
        image: abhi754/civicsense-admin-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5003
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        envFrom:
        - secretRef:
            name: civic-secrets
        env:
        - name: PORT
          value: "5003"
        - name: NODE_ENV
          value: "production"
        - name: COMPLAINT_SERVICE_URL
          value: "http://complaint-service:5002"
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:5001"
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: civic-sense
spec:
  type: ClusterIP
  selector:
    app: admin-service
  ports:
  - port: 5003
    targetPort: 5003
