apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: civic-sense
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: abhi754/civicsense-api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        env:
        - name: PORT
          value: "5000"
        - name: NODE_ENV
          value: "production"
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:5001"
        - name: COMPLAINT_SERVICE_URL
          value: "http://complaint-service:5002"
        - name: ADMIN_SERVICE_URL
          value: "http://admin-service:5003"
        - name: ANALYTICS_SERVICE_URL
          value: "http://analytics-service:5004"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: civic-sense
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30050
